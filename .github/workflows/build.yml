name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - run: python test_indicators.py
        shell: cmd
      - run: python test_logic.py
        shell: cmd
      - run: python test_restfeed.py
        shell: cmd
      - run: python test_vwap_check.py
        shell: cmd
      - run: python test_vwap_check.py
        shell: cmd
      # GUI test needs a desktop session. Windows runners have one, but this is
      # not allowed to block the EXE build if that ever changes.
      - run: python test_gui.py
        shell: cmd
        continue-on-error: true
      - run: |
          pyinstaller --noconfirm --onefile --windowed ^
            --name "Balfund_SENSEX_VWAP_Ladder" ^
            --hidden-import customtkinter ^
            --hidden-import indicators ^
            --hidden-import restfeed ^
            --hidden-import pyotp ^
            --hidden-import websocket ^
            --hidden-import certifi ^
            --collect-all customtkinter ^
            --collect-data certifi ^
            app.py
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: Balfund_SENSEX_VWAP_Ladder_EXE
          path: dist/Balfund_SENSEX_VWAP_Ladder.exe
          retention-days: 30
